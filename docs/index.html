<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132b38"><title>ResearchRadar</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172a33;background:#f5f8fa}*{box-sizing:border-box}body{margin:0}header{background:#132b38;color:white;padding:22px max(20px,calc((100vw - 1050px)/2))}header h1{margin:0;font-size:26px}header p{opacity:.8;margin:6px 0}main{max-width:1050px;margin:auto;padding:20px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}input,select,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #ccd8df;background:white}input{flex:1;min-width:180px}button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}.card{background:white;border:1px solid #dbe5ea;border-radius:14px;padding:17px;box-shadow:0 3px 10px #132b3808}.card h2{font-size:17px;line-height:1.4;margin:7px 0}.card p{font-size:14px;line-height:1.5}.meta{font-size:12px;color:#526875}.tag{display:inline-block;background:#e4f2f2;color:#17605d;padding:4px 8px;border-radius:99px;font-size:12px;margin:3px 3px 3px 0}.card a{color:#1266a1}summary{cursor:pointer;font-weight:600}small{color:#526875}.save{float:right;border:0;background:#e9f0f5;padding:6px 9px}.stats{padding:10px 0;color:#526875}.notice{background:#fff7de;padding:12px;border-radius:9px;font-size:13px}footer{padding:25px;text-align:center;color:#647b88}
</style></head><body><header><h1>◉ ResearchRadar</h1><p>Your personalized research feed · Papers and preprints</p></header><main><div class="notice">Your monitored topics are configured in <code>config.json</code> on GitHub. New records are checked on a schedule. Conference feeds are not yet included.</div><div class="toolbar"><input id="search" placeholder="Search titles and abstracts"><select id="topic"><option value="">All topics</option></select><select id="type"><option value="">All research</option><option value="paper">Published papers</option><option value="preprint">Preprints</option></select><button id="saved">☆ Saved only</button></div><div class="stats" id="stats">Loading research…</div><section class="cards" id="cards"></section></main><footer>ResearchRadar · Free personal research monitor</footer><script>
let items=[],savedOnly=false;const $=id=>document.getElementById(id);const saves=()=>new Set(JSON.parse(localStorage.getItem('rr-saved')||'[]'));function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function render(){const q=$('search').value.toLowerCase(),t=$('topic').value,ty=$('type').value,ss=saves();const filtered=items.filter(x=>(!t||x.topics.includes(t))&&(!ty||(ty==='preprint')===x.is_preprint)&&(!savedOnly||ss.has(x.id))&&(!q||(x.title+' '+x.abstract+' '+x.authors).toLowerCase().includes(q)));$('stats').textContent=filtered.length+' records · '+(window.lastUpdate||'Not updated yet');$('cards').innerHTML=filtered.map(x=>`<article class="card"><button class="save" data-id="${esc(x.id)}" aria-label="Save paper">${ss.has(x.id)?'★':'☆'}</button><div class="meta">${esc(x.date)} · ${x.is_preprint?'Preprint':'Publication'} · ${esc(x.journal||x.source)}</div><h2>${esc(x.title)}</h2><div>${x.topics.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p class="meta">${esc(x.authors)}</p><details><summary>Read abstract</summary><p>${esc(x.abstract.replace(/<[^>]*>/g,' ').slice(0,2200)||'Abstract not available in this source.')}</p></details><p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Open original source ↗</a></p></article>`).join('')||'<p>No matches yet. Try a different filter or wait for the next collection run.</p>';document.querySelectorAll('.save').forEach(b=>b.onclick=()=>{const s=saves();s.has(b.dataset.id)?s.delete(b.dataset.id):s.add(b.dataset.id);localStorage.setItem('rr-saved',JSON.stringify([...s]));render();});}
$('search').oninput=render;$('topic').onchange=render;$('type').onchange=render;$('saved').onclick=()=>{savedOnly=!savedOnly;$('saved').textContent=savedOnly?'★ Saved only':'☆ Saved only';render();};fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{items=data.items||[];window.lastUpdate='Updated '+new Date(data.updated).toLocaleString();const topics=[...new Set(items.flatMap(x=>x.topics||[]))].sort();$('topic').innerHTML='<option value="">All topics</option>'+topics.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');render();}).catch(()=>{$('stats').textContent='No feed yet. Run the GitHub workflow once to collect papers.'});
</script></body></html>
